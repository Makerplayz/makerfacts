<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerFacts | Home</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: #090d16; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        nav { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; }
        .nav-links a.active, .nav-links a:hover { color: var(--accent); }
        .container { max-width: 1100px; margin: 3rem auto; padding: 0 1.5rem; }
        .hero { text-align: center; padding: 4rem 1.5rem; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .hero p { color: var(--muted); max-width: 600px; margin: 0 auto 1.5rem auto; }
        .btn { display: inline-block; background: var(--accent); color: #000; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
        footer { text-align: center; padding: 2rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 4rem; }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">MakerFacts</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="channels.html">Channels</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="aboutme.html">Aboutme</a></li>
                <li><a href="legalpolicy.html">Legal</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <section class="hero">
            <h1>Welcome to MakerFacts</h1>
            <p>The central directory, project timeline, and official resource hub for Makerplays content and community spaces.</p>
            <a href="channels.html" class="btn">Explore Channels</a>
        </section>
    </div>
    <footer>
        <p>&copy; 2026 MakerFacts Network. All rights reserved.</p>
        <p><a href="legal.html">Privacy Policy & Terms</a></p>
    </footer>
</body>
</html>
