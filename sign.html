<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerFacts — Account Access System</title>

    <!-- Supabase JS Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #0d0d0d;
            --card-bg: #18181b;
            --accent: #facc15;
            --accent-hover: #eab308;
            --text: #ffffff;
            --muted: #a1a1aa;
            --border: #27272a;
            --error: #ef4444;
            --success: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; }

        /* HEADER / NAVBAR */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-login-btn {
            background: var(--accent);
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .header-login-btn:hover { background: var(--accent-hover); }

        .user-menu-wrapper {
            position: relative;
            display: none;
        }

        .user-badge {
            background: #27272a;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 160px;
            padding: 6px 0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            display: none;
            z-index: 100;
        }

        .user-dropdown.show { display: block; }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .dropdown-item:hover { background: #27272a; color: var(--error); }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 16px; right: 16px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-close-btn:hover { color: var(--text); }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .modal-brand-logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .brand-subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

        .auth-tabs {
            display: flex;
            background: #09090b;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1; padding: 8px 0;
            background: transparent; border: none;
            color: var(--muted); font-weight: 600; font-size: 0.875rem;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }

        .tab-btn.active { background: var(--card-bg); color: var(--accent); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
        .input-field { width: 100%; padding: 12px 14px; background: #09090b; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
        .input-field:focus { border-color: var(--accent); }

        .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: var(--accent-hover); }

        .status-message { font-size: 0.85rem; text-align: center; margin-top: 14px; display: none; }
        .status-message.error { color: var(--error); display: block; }
        .status-message.success { color: var(--success); display: block; }

        .form-footer { text-align: center; margin-top: 20px; }
        .form-footer a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
        .form-footer a:hover { color: var(--accent); }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="brand-wrapper">
            <button class="header-login-btn" id="header-auth-btn" onclick="openLoginModal('login')">Log In</button>

            <div class="user-menu-wrapper" id="header-user-menu">
                <button class="user-badge" onclick="toggleUserDropdown()">
                    <span id="user-display-name">MakerUser</span> ▾
                </button>
                <div class="user-dropdown" id="user-dropdown">
                    <button class="dropdown-item" onclick="handleLogout()">Log Out</button>
                </div>
            </div>
            
            <a href="#" class="brand-logo">MakerFacts</a>
        </div>
    </header>

    <div class="modal-overlay" id="login-modal" onclick="closeLoginModalOnOutsideClick(event)">
        <div class="auth-card">
            <button class="modal-close-btn" onclick="closeLoginModal()">✕</button>

            <div class="brand-header">
                <div class="modal-brand-logo">MakerFacts</div>
                <div class="brand-subtitle" id="modal-subtitle">Access your creator dashboard</div>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group" id="group-username" style="display: none;">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="input-field" placeholder="MakerUser">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input-field" placeholder="creator@makerfacts.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-btn" id="btn-submit">Log In</button>
                <div id="status-msg" class="status-message"></div>
            </form>

            <div class="form-footer" id="forgot-link-wrapper">
                <a href="#" onclick="handlePasswordReset()">Forgot password?</a>
            </div>
        </div>
    </div>

<script>
    // INITIALIZE SUPABASE CLIENT
    const SUPABASE_URL = 'https://tbvftxuugllhbnhslizc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oN8_w9Wq6k5S84z4QMlU1g_H107YGvS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = 'login';

    function openLoginModal(mode = 'login') {
        switchTab(mode);
        document.getElementById('login-modal').classList.add('active');
    }

    function closeLoginModal() {
        document.getElementById('login-modal').classList.remove('active');
        document.getElementById('auth-form').reset();
    }

    function closeLoginModalOnOutsideClick(e) {
        if (e.target.id === 'login-modal') closeLoginModal();
    }

    function switchTab(mode) {
        currentMode = mode;
        const loginTab = document.getElementById('tab-login');
        const signupTab = document.getElementById('tab-signup');
        const usernameGroup = document.getElementById('group-username');
        const submitBtn = document.getElementById('btn-submit');
        const statusMsg = document.getElementById('status-msg');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const forgotLink = document.getElementById('forgot-link-wrapper');

        statusMsg.style.display = 'none';

        if (mode === 'signup') {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            usernameGroup.style.display = 'block';
            document.getElementById('username').required = true;
            submitBtn.innerText = 'Create Account';
            modalSubtitle.innerText = 'Join the MakerFacts community';
            forgotLink.style.display = 'none';
        } else {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            usernameGroup.style.display = 'none';
            document.getElementById('username').required = false;
            submitBtn.innerText = 'Log In';
            modalSubtitle.innerText = 'Access your creator dashboard';
            forgotLink.style.display = 'block';
        }
    }

    // SIGN UP / LOG IN HANDLER
    async function handleAuth(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const username = document.getElementById('username').value.trim();
        const statusMsg = document.getElementById('status-msg');

        statusMsg.className = 'status-message success';
        statusMsg.innerText = 'Connecting...';

        if (currentMode === 'signup') {
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { username: username }
                }
            });

            if (error) {
                statusMsg.className = 'status-message error';
                statusMsg.innerText = error.message;
            } else {
                statusMsg.innerText = 'Account created! Check your email to confirm.';
                setTimeout(closeLoginModal, 2500);
            }

        } else { // Login Mode
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                statusMsg.className = 'status-message error';
                statusMsg.innerText = error.message;
            } else {
                statusMsg.innerText = 'Welcome back!';
                setTimeout(closeLoginModal, 1000);
            }
        }
    }

    // PASSWORD RESET LINK
    async function handlePasswordReset() {
        const email = prompt("Enter your account email:");
        if (!email) return;

        const { error } = await _supabase.auth.resetPasswordForEmail(email);
        if (error) {
            alert('Error: ' + error.message);
        } else {
            alert('Password reset link sent to your email address.');
        }
    }

    // AUTOMATIC SESSION MANAGEMENT
    _supabase.auth.onAuthStateChange((event, session) => {
        const authBtn = document.getElementById('header-auth-btn');
        const userMenu = document.getElementById('header-user-menu');
        const displayName = document.getElementById('user-display-name');

        if (session && session.user) {
            const name = session.user.user_metadata?.username || session.user.email.split('@')[0];
            displayName.innerText = name;
            authBtn.style.display = 'none';
            userMenu.style.display = 'block';
        } else {
            authBtn.style.display = 'block';
            userMenu.style.display = 'none';
        }
    });

    function toggleUserDropdown() {
        document.getElementById('user-dropdown').classList.toggle('show');
    }

    async function handleLogout() {
        await _supabase.auth.signOut();
        document.getElementById('user-dropdown').classList.remove('show');
    }
</script>

</body>
</html>
